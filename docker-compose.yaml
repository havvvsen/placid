services:
  postgres:
    container_name: "placid-postgres-database"
    image: postgres:18-alpine
    restart: always
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

  redis:
    container_name: "placid-redis-database"
    image: redis:7-alpine
    restart: always
    ports:
      - 6739:6739
