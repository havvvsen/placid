services:
  placid-db:
    image: postgres:18-alpine
    container_name: "placid-db"
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./placid-backend/data/init.sql:/home/init.sql
      - postgresql:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  placid-migrations:
    image: kukymbr/goose-docker:3.27.2
    container_name: "placid-migrations"
    environment:
      GOOSE_DRIVER: ${GOOSE_DRIVER}
      GOOSE_DBSTRING: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable
      GOOSE_COMMAND: up
    volumes:
      - ./placid-backend/data/migrations:/migrations
    depends_on:
      placid-db:
        condition: service_healthy
  placid-api:
    image: ghcr.io/${GHCR_USERNAME}/placid-api:latest
    container_name: "placid-api"
    ports:
      - ${API_PORT}:${API_PORT}
    depends_on:
      placid-db:
        condition: service_healthy
    environment:
      ALLOWED_CORS_ORIGINS: ${ALLOWED_CORS_ORIGINS}
      API_HOST: ${API_HOST}
      API_PORT: ${API_PORT}
      API_VERSION: ${API_VERSION}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  file-server:
    image: ghcr.io/${GHCR_USERNAME}/placid-file-server:latest
    container_name: "placid-file-server"
    ports:
      - ${FILE_SERVER_PORT}:${FILE_SERVER_PORT}
    environment:
      FILE_SERVER_PORT: ${FILE_SERVER_PORT}
      FILE_SERVER_BASE_PATH: ${FILE_SERVER_BASE_PATH}
  placid-nginx:
    image: ghcr.io/${GHCR_USERNAME}/placid-nginx:latest
    container_name: "placid-nginx"
    restart: always
    ports:
      - 80:80
      - 5000:5000
      - 5001:5001
    depends_on:
      placid-api:
        condition: service_ready
volumes:
  postgresql:
