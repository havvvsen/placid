name: Build and Push Api
on:
  push:
    branches:
      - main
    paths:
      - "placid-backend/**"
permissions:
  contents: read
  packages: write
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Image
        uses: docker/build-push-action@v6
        with:
          context: ./placid-backend
          file: Dockerfile.prod
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/placid-backend:latest
