<div class="flex flex-col items-center justify-center mt-15">
  <h4 class="text-4xl text-gray-200 mb-5">Create an account</h4>
  <p class="text-gray-500">With a Placid account, you can enjoy</p>
  <p class="text-gray-500">peace across multiple devices</p>

  <form class="flex flex-col gap-2 mt-10" (ngSubmit)="onSubmit()">
    <p class="text-gray-400">E-mail</p>
    <input
      name="email"
      type="text"
      placeholder="hi@placid.io"
      [(ngModel)]="email"
      class="border border-gray-700 px-5 py-2 text-white"
    />
    <p class="text-gray-400">Password</p>
    <input
      name="password"
      type="text"
      placeholder="password"
      [(ngModel)]="password"
      class="border border-gray-700 px-5 py-2 text-white"
    />
    <button
      class="border border-gray-700 bg-gray-700 px-10 py-2 rounded hover:bg-orange-600 hover:border-gray-200 hover:cursor-pointer hover:text-white mt-5 text-gray-200"
      type="submit"
    >
      Continue
    </button>
  </form>

  <div class="flex flex-row items-center gap-3 mt-5">
    <p class="text-gray-200 font-light text-sm">Already have an account ?</p>
    <a href="/login" class="text-sm text-gray-100 hover:text-orange-600">Login</a>
  </div>

  <div class="flex flex-row gap-1 mt-5">
    <p class="text-gray-200 font-light text-xs">By continuing, you agree to</p>
    <a href="" class="font-light text-gray-100 underline text-xs">Privacy Policy</a>
    <p class="text-gray-200 font-light text-xs">and</p>
    <a href="" class="text-gray-100 font-light underline text-xs">Terms & Conditions</a>
  </div>
</div>
