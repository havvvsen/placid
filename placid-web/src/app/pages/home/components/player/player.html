<div class="fixed bottom-6 -translate-x-1/2 w-[80%] md:w-[50%] lg:w-[30%] bg-gray-900 rounded-2xl p-4 border border-gray-600 z-50 flex flex-row items-center justify-between gap-4">
  <!-- Track details -->
  <div class="flex items-center gap-3 w-full">
    <div class="w-12 h-12 rounded-xl overflow-hidden bg-gray-800 border border-gray-700 shrink-0 flex items-center justify-center">
      @if (playerService.currentTrack()?.bgUrl) {
        <img [src]="env.bannerServerBaseUrl + '/' + playerService.currentTrack()?.bgUrl" [alt]="playerService.currentTrack()?.name" class="w-full h-full object-cover" />
      }
      </div>
    <div class="flex flex-col ">
      <span class="text-white font-semibold text-base truncate">
        {{ playerService.currentTrack()?.name || 'Select a Soundscape' }}
      </span>
      <span class="text-xs text-orange-400 font-medium capitalize truncate">
        {{ playerService.currentTrack()?.mood || '' }}
      </span>
    </div>
  </div>

    <!-- Play / Pause button -->
  <div >
      <button
        (click)="togglePlayStatus()"
        class="w-12 h-12 rounded-full bg-orange-500 text-white flex items-center justify-center transition-transform active:scale-95 hover:cursor-pointer"
        aria-label="Play/Pause track"
      >
        @if (playerService.isPlaying()) {
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="4" width="4" height="16" rx="1"></rect>
            <rect x="14" y="4" width="4" height="16" rx="1"></rect>
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" class="ml-0.5">
            <polygon points="5,3 19,12 5,21"></polygon>
          </svg>
        }
      </button>
  </div>
</div>
